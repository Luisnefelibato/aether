[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "ADAM — local voice-first OS agent (Kimi + ElevenLabs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "faster-whisper>=1.0",
  "pynput>=1.7",
  "aiofiles>=23.2",
  "chromadb>=0.5",
  "mss>=9.0",
  "pillow>=10.0",
  "playwright>=1.40",
  "psutil>=5.9",
  "pyperclip>=1.8",
  "opencv-python-headless>=4.8",
  "cursor-sdk>=1.0.0",
  "pywin32>=306",
  "pywinauto>=0.6.8",
  "imagehash>=4.3",
  "croniter>=2.0",
]

[project.optional-dependencies]
wake = ["openwakeword>=0.6.0", "onnxruntime>=1.16"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
aether = "aether_core.main:main"

[tool.setuptools.packages.find]
where = [
  "packages/core",
  "packages/audio",
  "packages/brain",
  "packages/voice",
  "packages/memory",
  "packages/supervisor",
  "packages/policy",
  "packages/caps/desktop_win",
  "packages/caps/dev_tools",
  "packages/caps/browser",
  "packages/caps/iot_home",
  "packages/caps/calendar_mail",
  "packages/caps/screen_camera",
  "packages/caps/files_intel",
  "packages/caps/backup",
  "packages/caps/health",
  "packages/caps/messaging",
  "packages/caps/integrations",
  "packages/scheduler",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
